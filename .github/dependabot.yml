version: 2

registries:
  bitwarden-github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/bitwarden/sdk
    username: ${{secrets.PACKAGES_USER}}
    password: ${{secrets.PACKAGES_ACCESS_TOKEN}}

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      java-bundles:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/" # even for `.github/workflows`
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
